<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Kiosk-style viewport: no zoom, no user scaling. The overlay is a
         transparent full-screen surface loaded via file:// by the
         out-of-process WebKitGTK worker (#739). -->

      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Picframe Overlay</title>
  </head>
  <body>
    <div id="overlay-root"></div>
    <script type="module" src="/src/overlay/main.ts"></script>
  </body>
</html>
