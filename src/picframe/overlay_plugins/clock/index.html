<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Picframe Clock</title>
  <style>
    :root { --fg: #f8fafc; --bg: transparent; --accent: #38bdf8; --w: 320px; --h: 240px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* The shell lays this iframe out at the fixed design size (--w × --h, from
       the plugin manifest `size`) and applies `transform: scale(layout.scale)`
       (a user-controlled zoom factor). The panel is sized to design × scale so
       its aspect matches the widget exactly — no contain-fit background gaps.
       Content is sized once at the design size using `calc(var(--w) * N/100)`
       (N = the old `Ncqw` value). This replaces container queries, which
       WebKitGTK does not resolve reliably in the overlay iframe (cqw → 0 on
       <html> and <body>). #752 */
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      -webkit-user-select: none; user-select: none; overflow: hidden;
      /* Per-edge content offset (px), set from the picframe:config postMessage
         content_offset. Each anchor picks up the relevant edges automatically
         (top-left -> top+left, middle-right -> right, middle-center -> none):
         the flex alignment rules above position content inside this padding
         box. Design-space px, so it scales with `transform: scale()`. #752 */
      padding-top: var(--pf-offset-top, 0px);
      padding-bottom: var(--pf-offset-bottom, 0px);
      padding-left: var(--pf-offset-left, 0px);
      padding-right: var(--pf-offset-right, 0px);
    }
    /* Anchor-driven content alignment (#752). The shell hands the panel anchor
       (e.g. "top-left") to the plugin via the picframe:config postMessage; the
       handler below stamps it on <body data-anchor>. The eight rules below push
       the flex content to the matching corner; the ninth (middle-center) is the
       default above. This makes e.g. weather at top-left hug the panel's top-left
       instead of sitting centered in the 320×240 / 360×240 design rectangle. */
    body[data-anchor="top-left"]      { align-items: flex-start; justify-content: flex-start; }
    body[data-anchor="top-center"]    { align-items: flex-start; justify-content: center; }
    body[data-anchor="top-right"]     { align-items: flex-start; justify-content: flex-end; }
    body[data-anchor="middle-left"]   { align-items: center;     justify-content: flex-start; }
    body[data-anchor="middle-right"]  { align-items: center;     justify-content: flex-end; }
    body[data-anchor="bottom-left"]   { align-items: flex-end;   justify-content: flex-start; }
    body[data-anchor="bottom-center"] { align-items: flex-end;   justify-content: center; }
    body[data-anchor="bottom-right"]  { align-items: flex-end;   justify-content: flex-end; }
       own readability background on its content container so the dark area
       hugs the content as tightly as possible and the photo shows through
       everywhere else. The background scales with `transform: scale()`. #752 */
    .pf-digital {
      text-align: center;
      padding: 0.15rem 0.5rem;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 8px;
      /* clock_opacity (#761): whole-clock dim 0..1, applied to both styles. */
      opacity: var(--pf-opacity, 1);
    }
    /* max() floors legibility at small scales; no upper cap — the shell scales
       the whole widget, so when the user shrinks the panel the widget shrinks
       with it. #752 */
    .pf-clock__time {
      font-size: max(1.2rem, calc(var(--w) * 0.15)); font-weight: 700;
      letter-spacing: 0.02em; line-height: 1; font-variant-numeric: tabular-nums;
    }
    .pf-clock__date {
      margin-top: 0.15rem; font-size: max(0.9rem, calc(var(--w) * 0.045));
      opacity: 0.85; font-weight: 500;
    }
    /* Extra text line (#761): mirrors the legacy clock_extra_source line. */
    .pf-clock__extra {
      margin-top: 0.1rem; font-size: max(0.8rem, calc(var(--w) * 0.04));
      opacity: 0.85; font-weight: 500; white-space: pre;
    }
    .pf-clock--hidden { display: none !important; }
    /* Analog layout (#760): the face + optional date live in a column flex
       wrapper that fills the content area left after the per-edge content
       offset (body padding). The SVG wrapper is `flex: 1; min-height: 0` so it
       grows to fill whatever vertical space remains after the date row, and
       the SVG itself is `width/height: 100%` of that wrapper. The default SVG
       `preserveAspectRatio="xMidYMid meet"` then letterboxes the 200x200
       viewBox inside the wrapper — so the face is always fully visible and
       never clipped, regardless of offset or whether the date is shown.
       This replaces the old fixed `min(calc(var(--w)*0.9), calc(var(--h)*0.9))`
       sizing, which ignored the content_offset and could clip the face
       bottom when the offset left too little clearance. */
    .pf-analog-wrap {
      display: flex; flex-direction: column; align-items: center;
      width: 100%; height: 100%;
      opacity: var(--pf-opacity, 1);
    }
    .pf-analog-svg-wrap { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
    svg.pf-analog { width: 100%; height: 100%; }
    .pf-analog .pf-hand { stroke: var(--fg); stroke-linecap: round; }
    .pf-analog .pf-hand--hour { stroke-width: 6; }
    .pf-analog .pf-hand--minute { stroke-width: 4; }
    .pf-analog .pf-hand--second { stroke-width: 2; stroke: var(--accent); }
    .pf-analog .pf-tick { stroke: var(--fg); stroke-width: 2; opacity: 0.6; }
    .pf-analog .pf-center { fill: var(--accent); }
  </style>
</head>
<body>
  <div class="pf-clock pf-digital" id="digital">
    <div class="pf-clock__time" id="time"></div>
    <div class="pf-clock__date" id="date"></div>
    <div class="pf-clock__extra pf-clock--hidden" id="extra"></div>
  </div>
  <div class="pf-clock pf-analog-wrap pf-clock--hidden" id="analog">
    <div class="pf-analog-svg-wrap">
      <svg class="pf-clock pf-analog" viewBox="-100 -100 200 200">
        <circle r="95" fill="#000000" fill-opacity="0.35" />
        <circle r="95" fill="none" stroke="var(--fg)" stroke-width="3" stroke-opacity="0.5" />
        <g id="ticks"></g>
        <line class="pf-hand pf-hand--hour" id="hand-hour" x1="0" y1="0" x2="0" y2="-50" />
        <line class="pf-hand pf-hand--minute" id="hand-minute" x1="0" y1="0" x2="0" y2="-72" />
        <line class="pf-hand pf-hand--second" id="hand-second" x1="0" y1="0" x2="0" y2="-82" />
        <circle class="pf-center" r="4" />
      </svg>
    </div>
    <div class="pf-clock__date pf-clock--hidden" id="analog-date"></div>
    <div class="pf-clock__extra pf-clock--hidden" id="analog-extra"></div>
  </div>
  <script>
    (function () {
      "use strict";
      var cfg = {
        style: "digital", clock_format: "24h", show_seconds: false, show_date: true,
        custom_format: "", opacity: 1.0, extra_source: "off", extra_text: ""
      };
      var fileText = ""; // live /dev/shm/clock.txt content pushed via picframe:data
      var timer = null;
      function applyConfig(config) {
        if (!config) return;
        Object.keys(cfg).forEach(function (k) { if (config[k] !== undefined) cfg[k] = config[k]; });
        setOpacity(cfg.opacity);
        render(); restartTimer(); updateExtra();
      }
      function setOpacity(value) {
        var o = Math.max(0, Math.min(1, Number(value) || 1));
        document.documentElement.style.setProperty("--pf-opacity", String(o));
      }
      function isAnalog() { return cfg.style === "analog"; }
      function use12h() { return cfg.clock_format === "12h"; }
      function pad(n) { return n < 10 ? "0" + n : String(n); }
      /* Minimal strftime subset (digital-only custom_format, #761) covering the
         directives legacy picframe users put in viewer.clock_format, incl. the
         glibc '-' non-padding modifier (e.g. '%-I:%M'). Unsupported tokens are
         passed through verbatim so a typo never blanks the clock. */
      function strftime(fmt, now) {
        var names = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
        var months = ["January","February","March","April","May","June","July",
          "August","September","October","November","December"];
        var h12 = (now.getHours() % 12) || 12;
        var repl = function (token) {
          switch (token) {
            case "Y": return String(now.getFullYear());
            case "y": return pad(now.getFullYear() % 100);
            case "m": return pad(now.getMonth() + 1);
            case "d": return pad(now.getDate());
            case "e": return String(now.getDate());
            case "H": return pad(now.getHours());
            case "I": return pad(h12);
            case "M": return pad(now.getMinutes());
            case "S": return pad(now.getSeconds());
            case "p": return now.getHours() >= 12 ? "PM" : "AM";
            case "A": return names[now.getDay()];
            case "a": return names[now.getDay()].slice(0, 3);
            case "B": return months[now.getMonth()];
            case "b": return months[now.getMonth()].slice(0, 3);
            case "j": return pad(dayOfYear(now));
            case "w": return String(now.getDay());
            case "%": return "%";
            default: return null;
          }
        };
        var out = "", i = 0;
        while (i < fmt.length) {
          if (fmt[i] !== "%") { out += fmt[i++]; continue; }
          var mod = "", j = i + 1;
          if (fmt[j] === "-") { mod = "-"; j++; }
          var token = fmt[j];
          var val = repl(token);
          if (val === null) { out += "%" + mod + token; }
          else { out += (mod === "-" && /^\d+$/.test(val)) ? String(parseInt(val, 10)) : val; }
          i = j + 1;
        }
        return out;
      }
      function dayOfYear(now) {
        var start = new Date(now.getFullYear(), 0, 0);
        return Math.floor((now - start) / 86400000);
      }
      function render() {
        var now = new Date();
        var digital = document.getElementById("digital");
        var analog = document.getElementById("analog");
        if (isAnalog()) {
          digital.classList.add("pf-clock--hidden"); analog.classList.remove("pf-clock--hidden"); drawAnalog(now);
        } else {
          analog.classList.add("pf-clock--hidden"); digital.classList.remove("pf-clock--hidden"); drawDigital(now);
        }
        updateExtra();
      }
      function drawDigital(now) {
        var timeEl = document.getElementById("time");
        // custom_format (#761): a non-empty strftime pattern overrides the 12h/24h
        // + show_seconds toggles for the digital time line (mirrors legacy
        // viewer.clock_format). The show_date line stays independent.
        if (cfg.custom_format) {
          timeEl.textContent = strftime(cfg.custom_format, now);
        } else {
          var h = now.getHours();
          var m = pad(now.getMinutes());
          var s = pad(now.getSeconds());
          var suffix = "";
          if (use12h()) { suffix = h >= 12 ? " PM" : " AM"; h = h % 12 || 12; }
          var time = h + ":" + m;
          if (cfg.show_seconds) time += ":" + s;
          time += suffix;
          timeEl.textContent = time;
        }
        var dateEl = document.getElementById("date");
        if (cfg.show_date) {
          dateEl.classList.remove("pf-clock--hidden");
          dateEl.textContent = now.toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
        } else { dateEl.classList.add("pf-clock--hidden"); }
      }
      function drawAnalog(now) {
        var h = now.getHours() % 12, m = now.getMinutes(), s = now.getSeconds();
        document.getElementById("hand-hour").setAttribute("transform", "rotate(" + ((h + m / 60) * 30) + ")");
        document.getElementById("hand-minute").setAttribute("transform", "rotate(" + ((m + s / 60) * 6) + ")");
        var secHand = document.getElementById("hand-second");
        if (cfg.show_seconds) { secHand.style.display = ""; secHand.setAttribute("transform", "rotate(" + (s * 6) + ")"); }
        else { secHand.style.display = "none"; }
        var dateEl = document.getElementById("analog-date");
        if (cfg.show_date) {
          dateEl.classList.remove("pf-clock--hidden");
          dateEl.textContent = now.toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
        } else { dateEl.classList.add("pf-clock--hidden"); }
      }
      function buildTicks() {
        var g = document.getElementById("ticks"), ns = "http://www.w3.org/2000/svg";
        for (var i = 0; i < 12; i++) {
          var line = document.createElementNS(ns, "line"), a = (i * 30 * Math.PI) / 180;
          line.setAttribute("x1", Math.sin(a) * 82); line.setAttribute("y1", -Math.cos(a) * 82);
          line.setAttribute("x2", Math.sin(a) * 90); line.setAttribute("y2", -Math.cos(a) * 90);
          line.setAttribute("class", "pf-tick"); g.appendChild(line);
        }
      }
      /* Extra text line (#761): mirrors legacy clock_extra_source. off = none,
         text = static cfg.extra_text, file = live /dev/shm/clock.txt content
         delivered via picframe:data (key "extra_text"). Rendered below the time
         in digital mode and below the date in analog mode. */
      function extraText() {
        if (cfg.extra_source === "off") return "";
        if (cfg.extra_source === "file") return fileText;
        return cfg.extra_text || "";
      }
      function updateExtra() {
        var text = extraText();
        var ids = isAnalog() ? ["analog-extra"] : ["extra", "analog-extra"];
        ids.forEach(function (id) {
          var el = document.getElementById(id);
          if (!el) return;
          if (text) { el.textContent = text; el.classList.remove("pf-clock--hidden"); }
          else { el.textContent = ""; el.classList.add("pf-clock--hidden"); }
        });
      }
      function restartTimer() {
        if (timer) { clearInterval(timer); timer = null; }
        timer = setInterval(render, cfg.show_seconds ? 1000 : 1000);
        render();
      }
      buildTicks();
      window.addEventListener("message", function (event) {
        var data = event.data || {};
        if (data.type === "picframe:config" && data.config) applyConfig(data.config);
        // #761: worker pushes live /dev/shm/clock.txt content for the file extra
        // source as { type: "picframe:data", key: "extra_text", value: "..." }.
        if (data.type === "picframe:data" && data.key === "extra_text") {
          fileText = data.value || "";
          updateExtra();
        }
        if (data.anchor) document.body.dataset.anchor = data.anchor;
        // Per-edge content offset (px): each anchor picks up the relevant edges
        // via body padding (see CSS above). Defaults to 0 (flush) when absent.
        if (data.content_offset) {
          var o = data.content_offset;
          document.body.style.setProperty("--pf-offset-top", (o.top || 0) + "px");
          document.body.style.setProperty("--pf-offset-bottom", (o.bottom || 0) + "px");
          document.body.style.setProperty("--pf-offset-left", (o.left || 0) + "px");
          document.body.style.setProperty("--pf-offset-right", (o.right || 0) + "px");
        }
      });
    })();
  </script>
</body>
</html>
