<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Picframe Weather</title>
  <style>
    :root { --fg: #f8fafc; --bg: transparent; --muted: rgba(248,250,252,0.7); --accent: #38bdf8; --w: 360px; --h: 240px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* The shell lays this iframe out at the fixed design size (--w × --h, from
       the plugin manifest `size`) and applies `transform: scale(layout.scale)`
       (a user-controlled zoom factor). The panel is sized to design × scale so
       its aspect matches the widget exactly — no contain-fit background gaps.
       Content is sized once at the design size using `calc(var(--w) * N/100)`
       (N = the old `Ncqw` value). This replaces container queries, which
       WebKitGTK does not resolve reliably in the overlay iframe (cqw → 0 on
       <html> and <body>). #752 */
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      -webkit-user-select: none; user-select: none; overflow: hidden;
    }
    .pf-weather { padding: 0.5rem; text-align: center; }
    .pf-weather__main { display: flex; align-items: center; justify-content: center; gap: 0.75rem; }
    .pf-weather__icon { font-size: max(1.5rem, calc(var(--w) * 0.11)); line-height: 1; }
    .pf-weather__temp { font-size: max(1.5rem, calc(var(--w) * 0.13)); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    .pf-weather__desc { margin-top: 0.4rem; font-size: max(0.9rem, calc(var(--w) * 0.042)); text-transform: capitalize; opacity: 0.9; }
    .pf-weather__loc { margin-top: 0.15rem; font-size: max(0.8rem, calc(var(--w) * 0.035)); opacity: 0.6; }
    .pf-weather__details { margin-top: 0.6rem; display: flex; gap: 1.25rem; justify-content: center; font-size: max(0.8rem, calc(var(--w) * 0.035)); opacity: 0.8; }
    .pf-weather__error { padding: 1.5rem; text-align: center; opacity: 0.7; font-size: 0.95rem; max-width: 16rem; }
    .pf-weather__placeholder { opacity: 0.5; font-size: 0.95rem; padding: 1rem; text-align: center; }
  </style>
</head>
<body>
  <div class="pf-weather" id="root">
    <div class="pf-weather__placeholder">Configure API key &amp; location to load weather.</div>
  </div>
  <script>
    (function () {
      "use strict";
      var cfg = { api_key: "", lat: null, lon: null, units: "metric", language: "en", refresh_seconds: 600 };
      var refreshTimer = null;
      var root = document.getElementById("root");
      var WEATHER_ICONS = {
        "01d": "☀️", "01n": "🌙", "02d": "⛅", "02n": "☁️", "03d": "☁️", "03n": "☁️",
        "04d": "☁️", "04n": "☁️", "09d": "🌧️", "09n": "🌧️", "10d": "🌦️", "10n": "🌧️",
        "11d": "⛈️", "11n": "⛈️", "13d": "❄️", "13n": "❄️", "50d": "🌫️", "50n": "🌫️"
      };
      function applyConfig(config) {
        if (!config) return;
        Object.keys(cfg).forEach(function (k) { if (config[k] !== undefined) cfg[k] = config[k]; });
        scheduleRefresh(true);
      }
      function unitSymbol() { return cfg.units === "imperial" ? "°F" : "°C"; }
      function windUnit() { return cfg.units === "imperial" ? "mph" : "m/s"; }
      function scheduleRefresh(immediate) {
        if (refreshTimer) { clearTimeout(refreshTimer); refreshTimer = null; }
        if (!cfg.api_key || cfg.lat == null || cfg.lon == null) {
          root.innerHTML = '<div class="pf-weather__placeholder">Configure API key &amp; location to load weather.</div>';
          return;
        }
        if (immediate) fetchWeather();
        var ms = Math.max(60, (cfg.refresh_seconds || 600)) * 1000;
        refreshTimer = setInterval(fetchWeather, ms);
      }
      function fetchWeather() {
        var url = "https://api.openweathermap.org/data/3.0/onecall?lat=" + encodeURIComponent(cfg.lat)
          + "&lon=" + encodeURIComponent(cfg.lon) + "&units=" + encodeURIComponent(cfg.units)
          + "&lang=" + encodeURIComponent(cfg.language) + "&appid=" + encodeURIComponent(cfg.api_key)
          + "&exclude=minutely,hourly,daily,alerts";
        fetch(url).then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        }).then(function (data) {
          render(data);
        }).catch(function (err) {
          renderError(err && err.message ? err.message : "Fetch failed");
        });
      }
      function render(data) {
        var cur = data.current || {};
        var weather = (cur.weather && cur.weather[0]) || {};
        var icon = WEATHER_ICONS[weather.icon] || "🌡️";
        var temp = Math.round(cur.temp != null ? cur.temp : 0);
        var desc = weather.description || "";
        var loc = data.timezone || "";
        var wind = cur.wind_speed != null ? cur.wind_speed + " " + windUnit() : "";
        var hum = cur.humidity != null ? cur.humidity + "%" : "";
        var html = '<div class="pf-weather__main">'
          + '<span class="pf-weather__icon">' + icon + '</span>'
          + '<span class="pf-weather__temp">' + temp + unitSymbol() + '</span></div>'
          + '<div class="pf-weather__desc">' + escapeHtml(desc) + '</div>'
          + '<div class="pf-weather__loc">' + escapeHtml(loc) + '</div>'
          + '<div class="pf-weather__details"><span>' + wind + '</span><span>' + hum + '</span></div>';
        root.innerHTML = html;
      }
      function renderError(msg) {
        root.innerHTML = '<div class="pf-weather__error">Weather unavailable: ' + escapeHtml(msg) + '</div>';
      }
      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      window.addEventListener("message", function (event) {
        var data = event.data || {};
        if (data.type === "picframe:config" && data.config) applyConfig(data.config);
      });
    })();
  </script>
</body>
</html>
