name: PR Quality Checks
on:
  pull_request:
    branches:
      - v2-dev

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pip install -e .[dev] # Uncomment when pyproject.toml is ready
          
      - name: Run Ruff (Linting & Formatting)
        run: |
          # ruff check . && ruff format --check . # Uncomment when ruff is configured
          echo "Ruff checks will be enabled in Task 1.1"
        
      - name: Run Mypy (Type Checking)
        run: |
          # mypy src/picframe # Uncomment when mypy is configured
          echo "Mypy checks will be enabled in Task 1.1"
        
      - name: Run Pytest
        run: |
          # pytest test/ # Uncomment when pytest is configured
          echo "Pytest checks will be enabled in Task 1.1"
